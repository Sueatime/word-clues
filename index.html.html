<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Clues</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<style>
:root{--h:230;--bg:hsl(var(--h) 45% 96%);--ink:hsl(var(--h) 50% 18%);--dark:hsl(var(--h) 48% 42%);--light:hsl(var(--h) 70% 84%);--muted:hsl(var(--h) 20% 42%);--pur:hsl(var(--h) 70% 68%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:hsl(var(--h) 35% 12%);--ink:hsl(var(--h) 60% 95%);--dark:hsl(var(--h) 50% 52%);--light:hsl(var(--h) 65% 80%);--muted:hsl(var(--h) 25% 70%)}}
:root[data-theme="dark"]{--bg:hsl(var(--h) 35% 12%);--ink:hsl(var(--h) 60% 95%);--dark:hsl(var(--h) 50% 52%);--light:hsl(var(--h) 65% 80%);--muted:hsl(var(--h) 25% 70%)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 8px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 12px;color:var(--muted);font-size:18px}
#msg{min-height:26px;font-weight:600;margin:6px 0 10px}
.clues{display:flex;flex-direction:column;gap:8px;margin:0 auto 14px;max-width:360px}
.clue{background:var(--dark);color:#fff;border-radius:10px;padding:18px 14px;font-size:clamp(24px,7vw,34px);font-weight:700;text-transform:uppercase;letter-spacing:2px}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 auto 20px;cursor:text}
.tile{width:clamp(42px,12.5vw,58px);height:clamp(42px,12.5vw,58px);border-radius:9px;display:grid;place-items:center;font-size:28px;font-weight:700;text-transform:uppercase;background:var(--dark);color:#fff;opacity:.55}
.tile.has{opacity:1}
.tile.cur{opacity:1;outline:3px solid var(--ink);outline-offset:-3px}
.tile.right{opacity:1;font-weight:800;outline:3px solid var(--ink);outline-offset:-3px}
.hid{position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;opacity:0;pointer-events:none}
.acts{display:flex;gap:12px;justify-content:center}
button{font:inherit;font-weight:600;cursor:pointer}
.acts button{padding:10px 18px;border-radius:8px;background:transparent;color:var(--ink);border:2px solid var(--muted)}
.acts button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.win{background:var(--pur);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:pop .5s ease-out;word-break:break-word}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
@media (min-width:800px){
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
#msg{min-height:40px}
.clues{max-width:480px}
.clue{font-size:40px;padding:22px 14px}
.tile{width:76px;height:76px;font-size:38px}
.acts button{padding:14px 30px}
.win{font-size:30px;max-width:620px}
}
</style>
</head>
<body>
<main>
  <h1>Word Clues</h1>
  <p class="sub">Three words, one answer.</p>
  <div id="clues" class="clues"></div>
  <div id="msg" role="status"></div>
  <div id="tiles" class="tiles" aria-label="Answer tiles"></div>
  <input id="g" class="hid" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" aria-label="Type your answer">
  <div class="acts"><button id="nb">New game</button><button id="give">Give up</button></div>
</main>
<script>
const PUZZLES=[["bark","trunk","leaf","tree"],["sand","wave","shell","beach"],["wing","feather","nest","bird"],["moon","star","night","sky"],["page","cover","author","book"],["snow","ice","winter","cold"],["pillow","dream","mattress","bed"],["doctor","nurse","ward","hospital"],["teacher","desk","homework","school"],["engine","wheel","road","car"],["petal","bee","garden","flower"],["bread","oven","flour","bakery"],["coin","bank","wallet","money"],["sail","anchor","captain","ship"],["goal","referee","kick","football"],["cheese","whiskers","tail","mouse"],["mane","roar","jungle","lion"],["cloud","umbrella","puddle","rain"],["lock","door","metal","key"],["string","chord","strum","guitar"],["photo","flash","lens","camera"],["hour","tick","hands","clock"],["hose","helmet","flames","firefighter"],["milk","cow","cream","dairy"],["bean","cup","morning","coffee"],["wool","baa","farm","sheep"],["ticket","screen","popcorn","cinema"],["wheel","pedal","chain","bicycle"],["yellow","monkey","peel","banana"],["red","core","cider","apple"],["citrus","vitamin","segments","orange"],["purple","vine","wine","grape"],["green","seeds","summer","watermelon"],["tropical","spiky","crown","pineapple"],["driver","route","stop","bus"],["rails","station","conductor","train"],["wings","pilot","runway","airplane"],["rotor","hover","blades","helicopter"],["helmet","handlebar","engine","motorcycle"],["cargo","highway","trailer","truck"],["keyboard","screen","software","computer"],["charge","power","cell","battery"],["stars","lens","observatory","telescope"],["circuit","machine","automatic","robot"],["north","iron","attract","magnet"],["cells","lens","lab","microscope"],["numbers","algebra","equation","math"],["past","ancient","dates","history"],["maps","countries","atlas","geography"],["notes","piano","melody","music"],["atoms","elements","experiment","chemistry"],["grammar","essay","literature","english"],["lead","sharpener","write","pencil"],["rubber","mistake","rub","eraser"],["blazer","tie","matching","uniform"],["quiet","shelf","borrow","library"],["swing","recess","slide","playground"],["desks","students","lesson","classroom"],["root","rabbit","crunchy","carrot"],["fries","mashed","baked","potato"],["red","ketchup","salad","tomato"],["tears","layers","rings","onion"],["green","florets","steamed","broccoli"],["cob","kernel","popcorn","corn"],["trunk","tusks","huge","elephant"],["neck","tall","spots","giraffe"],["antarctica","waddle","flightless","penguin"],["ocean","clever","fin","dolphin"],["slither","scales","hiss","snake"],["hop","burrow","fluffy","rabbit"],["peak","climb","snow","mountain"],["flow","bank","stream","river"],["trees","wolves","woods","forest"],["lava","eruption","ash","volcano"],["sand","camel","oasis","desert"],["colors","arc","sunshine","rainbow"],["sun","vacation","hot","summer"],["blossom","bloom","new","spring"],["leaves","fall","harvest","autumn"],["coat","frost","scarf","winter"],["heavy","flood","tropical","monsoon"],["gifts","santa","december","christmas"],["swoosh","shoes","athlete","nike"],["search","browser","doodle","google"],["camry","corolla","hilux","toyota"],["galaxy","korean","smartphone","samsung"],["streaming","movies","series","netflix"],["furniture","swedish","flatpack","ikea"],["kitchen","cook","restaurant","chef"],["cockpit","fly","cabin","pilot"],["tractor","crops","field","farmer"],["teeth","drill","cavity","dentist"],["wood","hammer","nails","carpenter"],["court","gavel","verdict","judge"],["cheese","slice","pepperoni","pizza"],["patty","bun","beef","burger"],["raw","fish","chopsticks","sushi"],["slurp","ramen","spaghetti","noodles"],["cocoa","sweet","bar","chocolate"],["paddy","grain","steamed","rice"],["tropical","stone","smoothie","mango"],["red","seeds","jam","strawberry"],["sour","yellow","squeeze","lemon"],["husk","palm","milk","coconut"],["paddle","lake","float","boat"],["kick","wheels","handle","scooter"],["fare","meter","hail","taxi"],["siren","emergency","stretcher","ambulance"],["orbit","sun","mars","planet"],["launch","space","fuel","rocket"],["wifi","online","website","internet"],["beam","light","pointer","laser"],["paint","canvas","brush","art"],["plants","organs","living","biology"],["force","gravity","energy","physics"],["stage","acting","script","drama"],["test","paper","marks","exam"],["bag","straps","carry","backpack"],["paper","lined","write","notebook"],["measure","centimeters","straight","ruler"],["green","cool","pickle","cucumber"],["leafy","popeye","green","spinach"],["round","leaves","coleslaw","cabbage"],["halloween","orange","lantern","pumpkin"],["stripes","stalk","predator","tiger"],["swing","ape","tail","monkey"],["gallop","saddle","hooves","horse"],["night","hoot","feathers","owl"],["salt","waves","deep","ocean"],["surrounded","palm","castaway","island"],["cliff","cascade","splash","waterfall"],["dark","bats","stalactite","cave"],["spooky","costume","candy","halloween"],["bunny","eggs","basket","easter"],["carrot","coal","frosty","snowman"],["cloudless","bright","warm","sunny"],["three","sneakers","german","adidas"],["mickey","castle","princess","disney"],["bricks","studs","toy","lego"],["cola","fizzy","rival","pepsi"],["dough","pastry","croissant","baker"],["garage","wrench","repair","mechanic"],["needle","fabric","suit","tailor"],["client","contract","courtroom","lawyer"],["yolk","fried","breakfast","egg"],["bowl","hot","broth","soup"],["bread","filling","lunch","sandwich"],["birthday","candles","icing","cake"]];
const HUES=[0,15,155,180,205,230,260,285,320];
let deck=[],cur,answer,typed="",over=false,hue=-1,timer=null;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function setHue(){let h;do{h=HUES[Math.floor(Math.random()*HUES.length)]}while(h===hue);hue=h;document.documentElement.style.setProperty("--h",h)}
function msg(t){$("msg").textContent=t}
function start(){
  clearTimeout(timer);
  if(!deck.length)deck=shuffle(PUZZLES);
  cur=deck.pop();answer=cur[3];setHue();
  typed="";over=false;
  const g=$("g");g.value="";g.maxLength=answer.length;g.disabled=false;g.focus({preventScroll:true});
  $("give").disabled=false;
  msg("");draw();
}
function draw(){
  $("clues").innerHTML=cur.slice(0,3).map(w=>`<div class="clue">${w}</div>`).join("");
  const k=Math.min(typed.length,answer.length-1);
  $("tiles").innerHTML=[...answer].map((ch,i)=>{
    const shown=over?ch:(typed[i]||"");
    const cls=over?"right":(typed[i]?"has":"")+(i===k?" cur":"");
    return `<div class="tile ${cls}">${shown}</div>`;
  }).join("");
}
function submit(){
  if(over)return;
  if(typed.length<answer.length){msg("Need "+answer.length+" letters.");return}
  if(typed===answer){
    over=true;$("give").disabled=true;$("g").disabled=true;
    draw();popup();confetti();return;
  }
  msg("Not quite. Try again.");typed="";$("g").value="";draw();
}
function popup(name){
  const d=document.createElement("div");d.className="win";d.textContent=(name||"Player")+" won with '"+answer.toUpperCase()+"'";
  const m=$("msg");m.textContent="";m.appendChild(d);
  const r=answer;timer=setTimeout(()=>{if(over&&answer===r)start()},6000);
}
const gi=$("g");
gi.addEventListener("input",()=>{if(over)return;gi.value=gi.value.replace(/[^a-z]/gi,"").toLowerCase();typed=gi.value;msg("");draw()});
gi.addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
$("tiles").addEventListener("click",()=>{if(!over)gi.focus()});
document.addEventListener("keydown",e=>{
  if(!over&&document.activeElement.tagName!=="INPUT"&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key.length===1||e.key==="Enter"||e.key==="Backspace"))gi.focus();
});
$("nb").onclick=start;
$("give").onclick=()=>{
  if(over)return;
  over=true;$("give").disabled=true;$("g").disabled=true;typed="";
  msg("You gave up. The word was "+answer.toUpperCase()+".");draw();
};
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
start();
</script>
</body>
</html>
